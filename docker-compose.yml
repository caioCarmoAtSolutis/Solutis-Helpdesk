  user-db:
    image: postgres:18
    container_name: user-db
    ports:
      - "5432:5432"
    volumes:
      - ./init-user-db:/docker-entrypoint-initdb.d
      - user_db_volume:/var/lib/postgresql/18
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_STOCK_DB}"]
      interval: 10s
      timeout: 10s
      retries: 2

  ticket-db:
    image: postgres:18
    container_name: ticket-db
    ports:
      - "5433:5432"
    volumes:
      - ./init-ticket-db:/docker-entrypoint-initdb.d
      - ticket_db_volume:/var/lib/postgresql/18
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_STOCK_DB}"]
      interval: 10s
      timeout: 10s
      retries: 2

  notification-db:
    image: postgres:18
    container_name: notification-db
    ports:
      - "5434:5432"
    volumes:
      - ./init-notification-db:/docker-entrypoint-initdb.d
      - notification_db_volume:/var/lib/postgresql/18
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_USER: "${POSTGRES_USER}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_STOCK_DB}"]
      interval: 10s
      timeout: 10s
      retries: 2

  rabbitmq:
    image: rabbitmq:4.3
    container_name: message-broker
    ports:
     - 5672:5672
     - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}"
    configs:
      - source: rabbitmq-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - rabbitmq-lib:/var/lib/rabbitmq/
      - rabbitmq-log:/var/log/rabbitmq

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_management]."

volumes:
  user_db_volume:
  notification_db_volume:
  notification_db_data:
  rabbitmq-lib:
  rabbitmq-log: