services:
  eureka-server:
    build: 
      context: ./Eureka-Server
    container_name: eureka-server
    environment:
      EUREKA_SERVER_URL: "${EUREKA_SERVER_URL}"
    ports:
     - 8761:8761
  gateway:
    build: 
      context: ./Solutis-Helpdesk-Gateway
    container_name: gateway
    environment:
      EUREKA_SERVER_URL: "${EUREKA_SERVER_URL}"
    ports:
     - 9000:9000

